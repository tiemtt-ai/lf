name: Application Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laravel Application Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        # Backend/auth/tenant layouts render @vite(...) on every request.
        # Without a real build, Laravel throws ViteManifestNotFoundException
        # for any test that renders one of those views (most of the suite).
        run: npm run build

      - name: Run application test suite
        env:
          # No .env is committed (.env is gitignored), so the runner supplies
          # config through the environment. phpunit.xml already pins APP_ENV,
          # the sqlite in-memory database and the array drivers; APP_KEY is the
          # only remaining requirement. Throwaway key, never a real secret.
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test

  integration-mysql:
    name: Database Constraint Integration (MariaDB 11.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4.3
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: lf_ci_integration
          MARIADB_USER: lf_ci
          MARIADB_PASSWORD: lf-ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run database-constraint integration tests against MariaDB
        # These self-skip unless the driver is `mysql`, so on the sqlite job
        # above they pass without asserting anything. This job is what actually
        # exercises the released CHECK constraints, tenant-first unique keys and
        # RESTRICT foreign keys — none of which SQLite creates, because the
        # migrations guard that DDL behind a mysql driver check.
        #
        # Named files rather than the whole directory on purpose:
        # BulkEnrollmentMysqlConcurrencyTest gates itself on one hard-coded
        # dedicated database name plus an atomic (non-array) cache store, and
        # throws rather than skips when either is absent. It needs its own job
        # with a Redis service and that exact schema name; adding it here would
        # only make this one red.
        #
        # No `npm run build` step. Most files here render no Blade view at all,
        # and LearningFrameworkAuthoringHttpMariaDbTest — which does — stubs
        # Vite with withoutVite(), so no manifest is ever needed.
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          # Laravel's mysql driver against MariaDB, matching the schema-drift
          # job, so MySQL-family raw SQL in released migrations is exercised.
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lf_ci_integration
          DB_USERNAME: lf_ci
          DB_PASSWORD: lf-ci-test-only
        run: |
          php artisan test \
            tests/Integration/LiveClassSchemaConstraintMysqlTest.php \
            tests/Integration/EnrollmentBindingTriggerMysqlTest.php \
            tests/Integration/LearningRuntimeMariaDbTest.php \
            tests/Integration/TeacherJudgmentRuntimeMariaDbTest.php \
            tests/Integration/LearningFrameworkAuthoringMariaDbTest.php \
            tests/Integration/LearningFrameworkAuthoringHttpMariaDbTest.php \
            tests/Integration/CourseTemplateLearningMappingPromotionMariaDbTest.php \
            tests/Integration/CourseTemplateLearningMappingHttpMariaDbTest.php \
            tests/Integration/MediaProcessingSubstrateMariaDbTest.php \
            tests/Integration/MediaStructuredExtractionMariaDbTest.php \
            tests/Integration/MediaCaptionProvenanceMariaDbTest.php
